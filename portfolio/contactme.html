<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Me - Zinia Ferdous Lamyea</title>
</head>

<body>
    <h2>Contact Me</h2>
    <p>Feel free to contact me for jobs, projects, or research opportunities.</p>

    <hr>

    <form method="post">
        <fieldset>
            <label for="firstName">First Name:</label>
            <input type="text" id="firstName" name="firstName" placeholder="Enter your first name" required>

            <br><br>

            <label for="lastName">Last Name:</label>
            <input type="text" id="lastName" name="lastName" placeholder="Enter your last name" required>

            <br><br>

            <label for="email">Email:</label>
            <input type="email" id="email" name="email" placeholder="Enter your email" required>

            <br><br>

            <label for="country">Country:</label>
            <select id="country" name="country" required>
                <option value="">Select Country</option>
                <option value="Bangladesh">Bangladesh</option>
                <option value="Other">Other</option>
                <option value="UK">UK</option>
                <option value="USA">USA</option>
            </select>

            <br><br>

            <label for="reason">Reason of Contact:</label>
            <select id="reason" name="reason" required>
                <option value="">Select a Reason</option>
                <option value="Job">Job</option>
                <option value="Project">Project</option>
                <option value="Research">Research</option>
            </select>

            <br><br>

            <label for="domain">Domain:</label>
            <select id="domain" name="domain" required>
                <option value="">Select a Domain</option>
                <option value="Web Development">Web Development</option>
                <option value="AI/ML Development">AI/ML Development</option>
                <option value="Mobile Development">Mobile Development</option>
            </select>

            <br><br>

            <label for="message">Message:</label>
            <br>
            <textarea id="message" name="message" rows="5" cols="40" placeholder="Write your message here..."
                required></textarea>

            <br><br>

            <label for="appointmentDate">Appointment Date:</label>
            <input type="date" id="appointmentDate" name="appointmentDate" required>

            <br><br>

            <input type="submit" value="Submit">
            <input type="reset" value="Reset">

        </fieldset>
    </form>
