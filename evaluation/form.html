<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <form method="post">
        <table>
            <h2>Donor Information</h2>
            <tr>
                <td><label for="firstName">First Name*</label></td>
                <td><input type="text" id="firstName" name="firstName" required></td><br><br>
            </tr>
            <tr>
                <td><label for="lastName">Last Name*</label></td>
                <td><input type="text" id="lastName" name="lastName" required></td><br>
            </tr>
            <tr>
                <td><label for="company">Company Name</label></td>
                <td><input type="text" id="company" name="company"></td><br>
            </tr>
            <tr>
                <td><label for="add1">Address 1*</label> </td>
                <td><input type="text" id="add1" name="add1" required></td><br>
            </tr>
            <tr>
                <td><label for="add2">Address 2</label> </td>
                <td><input type="text" id="add2" name="add2" required></td><br>
            </tr>
            <tr>
                <td><label for="city">City*</label> </td>
                <td><input type="text" id="city" name="city" required></td><br>
            </tr>
            <tr>
                <td><label for="state">State*</label></td>
                <td><select id="state" name="state" required>
                        <option>Select a State</option>
                        <option>Dhaka</option>
                        <option>Chittagong</option>
                        <option>Khulna</option>
                        <option>Barishal</option>
                    </select>
                </td>
            </tr>
            <tr>
                <td><label for="zip">Zip Code*</label></td>
                <td><input type="text" id="zip" name="zip" required></td><br>
            </tr>
            <tr>
                <td><label for="country">Country*</label></td>
                <td><select id="country" name="country" required>
                        <option>Select a Country
                        </option>
                        <option>Bangladesh</option>
                        <option>India</option>
                        <option>UK</option>
                        <option>USA</option>
                    </select>
                </td>
            </tr>
            <tr>
                <td><label for="phone">Phone</label> </td>
                <td><input type="tel" id="phone" name="phone"></td><br>
            </tr>
            <tr>
                <td><label for="fax">Fax</label> </td>
                <td><input type="text" id="fax" name="fax"></td><br>
            </tr>
            <tr>
                <td><label for="email">Email*</label> </td>
                <td><input type="email" id="email" name="email" required></td><br>
            </tr>
            <tr>
                <td><label>Donation Amount*</label><br>(Check a button or type in your amount)</label></td>
                <td><input type="radio" value="none"> None
                    <input type="radio" value="50"> $50
                    <input type="radio" value="75"> $75
                    <input type="radio" value="100"> $100
                    <input type="radio" value="250"> $250
                    <input type="radio" value="other"> Other
                </td>
            </tr>
            <tr>
                <td></td>
                <td>
                    <label for="otherAmount">Other Amount $</label>
                    <input type="number" id="otherAmount" name="otherAmount">
                </td>
            </tr>
            <tr>
                <td>Recurring Donation<br>(Check if yes)</td>
                <td>
                    <input type="checkbox" id="recurring" name="recurring"> <label for="recurring">I am interested in
                        giving
                        on a regular basis.</label><br>
                    Monthly Credit Card $ <input type="text" name="monthlyAmount"> For <input type="text" name="months">
                    Months
                </td>
            </tr>
        </table>

        <h3>Honorarium and Memorial Donation Information</h3>
        <table>
            <tr>
                <td>I would like to make this donation</td>
                <td>
                    <input type="radio" id="to_honor" name="honorType" value="honor"> <label for="to_honor">To
                        Honor</label><br>
                    <input type="radio" id="in_memory" name="honorType" value="memory"> <label for="in_memory">In Memory
                        of</label>
                </td>
            </tr>
            <tr>
                <td><label for="honorName">Name</label></td>
                <td><input type="text" id="honorName" name="honorName"></td>
            </tr>
            <tr>
                <td><label for="ackDonation">Acknowledge Donation to</label></td>
                <td><input type="text" id="ackDonation" name="ackDonation"></td>
            </tr>
            <tr>
                <td><label for="ackAddress">Address</label></td>
                <td><input type="text" id="ackAddress" name="ackAddress"></td>
            </tr>
            <tr>
                <td><label for="ackCity">City</label></td>
                <td><input type="text" id="ackCity" name="ackCity"></td>
            </tr>
            <tr>
                <td><label for="ackState">State</label></td>
                <td>
                    <select id="ackState" name="ackState" required>
                        <option value="">Select a State</option>
                        <option value="dh div">Dhaka Division</option>
                        <option value="ch div">Chattogram Division</option>
                    </select>
                </td>
            </tr>
            <tr>
                <td><label for="ackZip">Zip</label></td>
                <td><input type="text" id="ackZip" name="ackZip"></td>
            </tr>
            <tr>
                <td></td>
                <td>
                    <input type="reset" value="Reset">
                    <input type="submit" value="Continue">
                </td>
            </tr>

        </table>
    </form>


</body>

</html>
